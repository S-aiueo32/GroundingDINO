name: dino
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.4
  - setuptools>=77
  - packaging>=24.2
  - wheel
  - ninja
# Install the matching CUDA toolkit for a CUDA extension build, then follow
# README installation step 3 to build torch-ms-deform-attn and install this repo.
